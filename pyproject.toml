[project]
name = "repd-tools"
version = "0.1.0"
description = "Python tools for the UK Renewable Energy Planning Database (REPD)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Damian Bemben" }]
keywords = ["renewable energy", "planning", "UK", "GIS", "REPD"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "matplotlib>=3.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ipykernel>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repd"]
